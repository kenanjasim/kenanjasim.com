name: Portfolio CI Build

on:
  push:
    branches-ignore: ["main"]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build CV PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv
          root_file: cv.tex
          latexmk_use_xelatex: true
      - name: Add CV to site
        run: cp cv/cv.pdf static/cv.pdf
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build with Hugo (test)
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --minify 2>&1 | tee build.log
          # Unfilled TODO placeholders are left out of the page; surface them in the run summary
          if grep -q "placeholder not filled in" build.log; then
            echo "### Portfolio TODOs still open" >> "$GITHUB_STEP_SUMMARY"
            grep -o "placeholder not filled in: .*" build.log | sed 's/^placeholder not filled in: /- /' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Site stats
        run: |
          test -f public/cv.pdf && echo "✅ cv.pdf included"
          find public -name "*.html" | wc -l | xargs echo "HTML files:"
          du -sh public/ | cut -f1 | xargs echo "Total size:"
