# One-page CV: no blog, tags or feeds here — writing lives on kenan.sh
disableKinds = ['taxonomy', 'term', 'rss', 'section']

[markup.goldmark.renderer]
unsafe = true

[params]
author = 'Kenan Jasim'
description = 'Kenan Jasim — software engineer in London, focused on backend systems and optimisation problems.'
keywords = 'Kenan Jasim,software engineer,Go,Kubernetes,distributed systems,London'
# TODO(kenan): confirm you're happy with this photo on a professional site, or swap in a headshot
avatarURL = 'images/avatar.jpg'
info = ['Software Engineer at [Aalyria](https://aalyria.com)', 'London, UK']
